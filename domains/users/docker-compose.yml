services:
  users-create:
    build: ./US-users-create
    env_file: .env
    image: leviathan119/createuser:latest
    ports:
      - "5020:5020"
    restart: unless-stopped

  users-delete:
    build: ./US-users-delete
    env_file: .env
    image: leviathan119/deleteuser:latest
    ports:
      - "5021:5021"
    restart: unless-stopped

  users-list-find:
    build: ./US-users-list-find
    env_file: .env
    image: leviathan119/readuser:latest
    ports:
      - "5022:5022"
    restart: unless-stopped

  users-update:
    build: ./US-users-update
    env_file: .env
    image: leviathan119/updateuser:latest
    ports:
      - "5023:5023"
    restart: unless-stopped

