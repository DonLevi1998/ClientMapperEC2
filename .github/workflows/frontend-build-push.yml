name: Build and push frontend image

on:
  push:
    paths:
      - 'client-mapper-frontend/**'
      - '.github/workflows/frontend-build-push.yml'
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/client-mapper-frontend:latest ./client-mapper-frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/client-mapper-frontend:latest